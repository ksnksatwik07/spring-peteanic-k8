apiVersion: apps/v1
kind: Deployment

metadata:
  name: spring-petclinic

spec:
  replicas: 500

  selector:
    matchLabels:
      app: spring-petclinic

  template:
    metadata:
      labels:
        app: spring-petclinic

    spec:
      containers:
        - name: spring-petclinic

          image: spring-petclinic:latest

          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            # Spring Boot listens on all network interfaces
            - name: SERVER_ADDRESS
              value: "0.0.0.0"

            # Application port
            - name: SERVER_PORT
              value: "8080"

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "1080Mi"

          # Check whether the application is ready
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          # Restart the container if Spring Boot becomes unhealthy
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3